services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: predict_rivals
      POSTGRES_USER: predict_rivals
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - predict_rivals_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predict_rivals"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  predict_rivals_pgdata:
